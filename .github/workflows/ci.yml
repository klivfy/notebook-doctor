name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build NotebookDoctor.csproj -c Release
      - name: Testes
        run: dotnet test NotebookDoctor.Tests/NotebookDoctor.Tests.csproj -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: NotebookDoctor.Tests/TestResults/*.trx
