name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # Linux sai mais barato que Windows em minutos do Actions; o WPF compila aqui com EnableWindowsTargeting
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar o app
        run: dotnet build src/NotebookDoctor/NotebookDoctor.csproj -c Release -p:EnableWindowsTargeting=true

      - name: Testes
        run: dotnet test tests/NotebookDoctor.Tests -c Release --logger "trx;LogFileName=resultados.trx"

      # Leva 8.4 (C20): garante que o app também publica para PCs Arm (Snapdragon). Não roda lá; só prova que compila e empacota.
      - name: Publicar para Windows Arm64
        run: dotnet publish src/NotebookDoctor/NotebookDoctor.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableWindowsTargeting=true -o publish-arm64

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: tests/NotebookDoctor.Tests/TestResults/*.trx

  windows:
    # Fase 5: desinstalador e varredura de sobras dependem do registro, de caminhos e de permissões do Windows de verdade
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar o app
        run: dotnet build src/NotebookDoctor/NotebookDoctor.csproj -c Release

      - name: Testes
        run: dotnet test tests/NotebookDoctor.Tests -c Release

      # Redesign visual: abre todas as abas e janelas no modo demonstração, nos temas claro e escuro, e guarda uma imagem de cada uma.
      # Falha se alguma tela não abrir (estilo ou recurso que falta). As imagens ficam no artefato "telas".
      - name: Verificação visual (modo demonstração)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'smoke-out'
          $p = Start-Process -FilePath 'src/NotebookDoctor/bin/Release/net8.0-windows/NotebookDoctor.exe' -ArgumentList '--demo', "--smoke=$out" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Error 'A verificação visual passou de 5 minutos.'; exit 1 }
          if (Test-Path "$out/smoke.txt") { Get-Content "$out/smoke.txt" } else { Write-Error 'O app não gerou o relatório.' }
          exit $p.ExitCode

      - name: Publicar as imagens das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas
          path: smoke-out
          if-no-files-found: ignore
