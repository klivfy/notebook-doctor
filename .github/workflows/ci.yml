name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # Linux sai mais barato que Windows em minutos do Actions; o WPF compila aqui com EnableWindowsTargeting
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar o app
        run: dotnet build NotebookDoctor.csproj -c Release -p:EnableWindowsTargeting=true

      - name: Testes
        run: dotnet test tests/NotebookDoctor.Tests -c Release --logger "trx;LogFileName=resultados.trx"

      # Leva 8.4 (C20): garante que o app também publica para PCs Arm (Snapdragon). Não roda lá; só prova que compila e empacota.
      - name: Publicar para Windows Arm64
        run: dotnet publish NotebookDoctor.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableWindowsTargeting=true -o publish-arm64

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: tests/NotebookDoctor.Tests/TestResults/*.trx

  windows:
    # Fase 5: desinstalador e varredura de sobras dependem do registro, de caminhos e de permissões do Windows de verdade
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar o app
        run: dotnet build NotebookDoctor.csproj -c Release

      - name: Testes
        run: dotnet test tests/NotebookDoctor.Tests -c Release
